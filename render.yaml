services:
  - type: web
    name: receipt-ai-backend
    env: python
    repo: https://github.com/PGMODE-CELL/RECIEPT-AI
    branch: main
    buildCommand: pip install -r requirements-render.txt
    startCommand: cd huh/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://recieptsoftwareai.netlify.app,https://reciept-ai.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_DEFAULT
        value: 1000/minute
      - key: ACCESS_TOKEN_EXPIRE_DAYS
        value: "30"

databases:
  - name: receipt-ai-db
    databaseName: receipt_ai
    user: receipt_ai
    plan: free
