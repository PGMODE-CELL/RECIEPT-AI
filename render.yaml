services:
  - type: web
    name: receipt-ai-backend
    env: docker
    repo: https://github.com/PGMODE-CELL/RECIEPT-AI
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://recieptsoftwareai.netlify.app,https://reciept-ai.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: receipt-ai-db
    databaseName: receipt_ai
    user: receipt_ai
    plan: free
