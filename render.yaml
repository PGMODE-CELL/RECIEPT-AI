services:
  - type: web
    name: receipt-ai-backend
    env: docker
    repo: https://github.com/PGMODE-CELL/RECIEPT-AI
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: receipt-ai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_DEFAULT
        value: 1000/minute
      - key: ACCESS_TOKEN_EXPIRE_DAYS
        value: "30"

databases:
  - name: receipt-ai-db
    databaseName: receipt_ai
    user: receipt_ai
    plan: free
