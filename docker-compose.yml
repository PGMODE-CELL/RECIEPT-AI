version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: receiptai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-receiptai}
      POSTGRES_DB: receiptai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptai"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./huh/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - DATABASE_URL=postgresql://receiptai:${DB_PASSWORD:-receiptai}@db:5432/receiptai
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:80,http://localhost:4200}
      - ENVIRONMENT=production
      - DEBUG=false
      - HTTPS_REDIRECT=false
    volumes:
      - backups:/app/backups
      - uploads:/app/app/uploads

  frontend:
    build:
      context: ./app/app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backups:
  uploads:
