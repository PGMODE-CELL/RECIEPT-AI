[build]
  base = "app/app/"
  command = "npm run build"
  publish = "dist/public/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "https://receipt-ai-backend.onrender.com/api/:splat"
  # After Render deploys, replace the URL above with your actual Render URL
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
