[build]
  command = """mkdir -p netlify/functions/backend && cp -r huh/backend/* netlify/functions/backend/ && cd app/app && npm run build"""
  publish = "app/app/dist/public/"
  functions = "netlify/functions/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
