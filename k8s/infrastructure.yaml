apiVersion: v1
kind: Namespace
metadata:
  name: receipt-ai
---
apiVersion: v1
kind: Secret
metadata:
  name: receipt-ai-secrets
  namespace: receipt-ai
type: Opaque
stringData:
  database-url: "postgresql://receipt_ai:changeme@postgres:5432/receipt_ai"
  redis-url: "redis://redis:6379/0"
  secret-key: "change-me-in-production"
  encryption-key: "change-me-in-production"
  s3-endpoint: ""
  s3-bucket: ""
  s3-access-key: ""
  s3-secret-key: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: receipt-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: receipt-ai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: receipt_ai
            - name: POSTGRES_USER
              value: receipt_ai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: receipt-ai-secrets
                  key: database-url
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: receipt-ai
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: receipt-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: receipt-ai
spec:
  ports:
    - port: 6379
  selector:
    app: redis